version: 2

updates:
- package-ecosystem: uv
  directory: "/"
  schedule:
    interval: weekly
  # Skip versions newer than 7 days so Dependabot never opens a PR for a
  # release uv cannot yet resolve (Astral's recommended setting).
  cooldown:
    default-days: 7
  groups:
    python-packages:
      patterns:
        - "*"
