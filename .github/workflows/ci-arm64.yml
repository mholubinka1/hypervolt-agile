name: Docker Build/Publish Image - ARMv7

on:
  push:
    branches:
      - '**'

jobs:
  ARM64_App_Image_Build_and_Push:
    runs-on: [ ARM64 ]
    env:
      DOCKER_REGISTRY: docker.io
      DOCKER_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/hypervolt-agile
      DOCKER_TARGET_PLATFORM: linux/arm/arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Prepare
        if: success()
        id: prepare
        run: |
          echo "docker_platform=${DOCKER_TARGET_PLATFORM}" >> $GITHUB_OUTPUT
          echo "docker_image=${DOCKER_REGISTRY}/${DOCKER_IMAGE}" >> $GITHUB_OUTPUT
          echo "version=${GITHUB_RUN_NUMBER}" >> $GITHUB_OUTPUT

      - name: Docker info
        run: |
          docker version
          docker info
          docker ps

      - name: Docker Login
        if: success()
        uses: nick-fields/retry@v4
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        with:
          max_attempts: 3
          retry_wait_seconds: 15
          command: |
            echo "$DOCKERHUB_TOKEN" | docker login "$DOCKER_REGISTRY" -u "$DOCKERHUB_USERNAME" --password-stdin

      - name: Get Docker Image Tag
        if: success()
        id: tag
        shell: bash
        run: |
          branchName=${{ github.ref_name }}
          if [ $branchName != 'main' ]; then image_tag='dev'; else image_tag='latest'; fi
          echo "tag=$(echo $image_tag)" >> $GITHUB_OUTPUT

      - name: Docker Build and Push
        uses: nick-fields/retry@v4
        env:
          DOCKER_IMAGE_TAG: ${{ steps.prepare.outputs.docker_image }}:${{ steps.tag.outputs.tag }}
        with:
          max_attempts: 3
          retry_wait_seconds: 15
          command: |
            docker buildx build --push --tag "$DOCKER_IMAGE_TAG" .
