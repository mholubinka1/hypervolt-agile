name: Code Quality Checks

on:
  push:
    branches:
      - '**'

jobs:
  checks:
    name: Run all code quality checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python 3.13
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1

      - name: Install project dependencies
        run: uv sync --frozen

      - name: Run tests with coverage
        run: uv run pytest --cov=app --cov=extensions --cov-report=term-missing --cov-report=json:coverage.json

      - name: Check coverage has not decreased vs main
        run: bash .github/scripts/check_coverage_diff.sh
        env:
          CURRENT_REF_NAME: ${{ github.ref_name }}

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 'lts/*'

      - name: Install markdown-link-check
        run: npm install -g markdown-link-check

      - name: Verify lock file is consistent with pyproject.toml
        run: uv lock --check

      - name: Type check with mypy
        run: uv run mypy app

      - name: Check import ordering with isort
        run: uv run isort --check-only --profile black app

      - name: Check code formatting with black
        run: uv run black --check app

      - name: Check linting with ruff
        run: uv run ruff check --no-fix app

      - name: Check markdown links
        run: find . -name "*.md" -not -path "./.git/*" -print0 | xargs -0 -r markdown-link-check --config .markdown-link-check.json

      - name: Scan for secrets with gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Security analysis with bandit
        run: uv run bandit -r -c pyproject.toml app
