repos:
  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: 0.12.8
    hooks:
      - id: uv-lock
      - id: uv-export
        # No args override -- the hook's own defaults (--frozen
        # --output-file=requirements.txt --quiet) are already correct. The
        # old Poetry-era args here ("-f", "requirements.txt", "-o", "requirements.txt")
        # were carried over from poetry-export's flag names without checking
        # uv export's: -f there means --find-links, not --format, so
        # "requirements.txt" was silently being passed as a bogus package
        # index search path. Only -o (--output-file, coincidentally the same
        # short flag in both tools) was doing anything -- masking the bug.
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v2.3.1
    hooks:
      - id: mypy
        exclude: ^tests/
        additional_dependencies: [
          'types-requests',
          'types-simplejson',
          'types-PyYAML',
          'sqlalchemy-stubs',
          'pydantic',
        ]
  - repo: https://github.com/pycqa/isort
    rev: 9.0.1
    hooks:
      - id: isort
        name: isort (python)
        args: ["--profile", "black"]
  - repo: https://github.com/psf/black
    rev: 26.5.1
    hooks:
      - id: black
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.5
    hooks:
      - id: ruff
        args: [ --fix ]
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
  - repo: https://github.com/tcort/markdown-link-check
    rev: v3.15.0
    hooks:
      - id: markdown-link-check
        args: ["--config", ".markdown-link-check.json"]
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
  - repo: https://github.com/PyCQA/bandit
    rev: 1.9.4
    hooks:
      - id: bandit
        args: ["-c", "pyproject.toml"]
        exclude: ^tests/
        additional_dependencies: ["bandit[toml]"]
