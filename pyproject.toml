[project]
name = "hypervolt-agile"
version = "0.1.0"
description = ""
authors = [{ name = "Matt Holubinka", email = "meholubinka@gmail.com" }]
readme = "README.md"
requires-python = ">=3.13,<4.0"
dependencies = [
    "httpx>=0.28,<0.29",
    "tzdata>=2025.2,<2027.0",
    "aiohttp>=3.12.15,<4.0.0",
    "websockets>=16,<18",
    "pyyaml>=6.0.3,<7.0.0",
    "pydantic>=2.12.5,<3.0.0",
]

[dependency-groups]
dev = [
    "isort>=8.0.1,<10.0.0",
    "black>=26.3.1,<27.0.0",
    "mypy>=1.8,<3.0",
    "ruff>=0.16.0,<0.17.0",
    "pre-commit>=4.3.0,<5.0.0",
    "types-pyyaml>=6.0.12.20250915,<7.0.0.0",
    "bandit[toml]>=1.9.4,<2.0.0",
    "pytest>=9.1.1,<10.0.0",
    "pytest-asyncio>=1.4.0,<2.0.0",
    "pytest-cov>=7.1.0,<8.0.0",
]

[tool.uv]
package = false

[tool.ruff.lint]
# BLE001 (blind except Exception) is disabled repo-wide: every hit is a caller-supplied
# callable or a top-level entrypoint/reconnect boundary where no narrower exception type
# exists to catch, so the rule adds noise rather than catching real bugs here.
# I001 (import sorting) is disabled: isort --profile black already owns import order in
# CI, and it disagrees with ruff's isort implementation on a couple of groupings, so
# running both fights over the same job.
ignore = ["BLE001", "I001"]

[tool.mypy]
plugins = ["pydantic.mypy"]
python_version = "3.13"
exclude=["tests", ".reference"]
mypy_path = ["app", "extensions"]
disallow_untyped_defs = true
disallow_subclassing_any = true
disallow_untyped_calls = false
check_untyped_defs = true
disallow_untyped_decorators = false
ignore_missing_imports = true
implicit_reexport = false
no_implicit_optional = true
strict_equality = true
warn_redundant_casts = true
warn_unused_ignores = true

[tool.bandit]
exclude_dirs = [".deprecated", ".reference"]

[tool.pytest.ini_options]
pythonpath = ["app", "extensions"]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.coverage.run]
source = ["app", "extensions"]
branch = true

[tool.coverage.report]
show_missing = true
skip_empty = true
