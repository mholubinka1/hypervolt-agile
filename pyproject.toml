[tool.poetry]
name = "hypervolt-agile"
version = "0.1.0"
description = ""
authors = ["Matt Holubinka <meholubinka@gmail.com>"]
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = "^3.11"
httpx = "^0.28"
tzdata = ">=2025.2,<2027.0"
aiohttp = "^3.12.15"
websockets = ">=16,<18"
pyyaml = "^6.0.3"
pydantic = "^2.12.5"


[tool.poetry.group.dev.dependencies]
isort = ">=8.0.1,<10.0.0"
black = "^26.3.1"
mypy = ">=1.8,<3.0"
ruff = "^0.16.0"
pre-commit = "^4.3.0"
types-pyyaml = "^6.0.12.20250915"
bandit = {version = "^1.9.4", extras = ["toml"]}
pytest = "^9.1.1"
pytest-asyncio = "^1.4.0"
pytest-cov = "^7.1.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff.lint]
# BLE001 (blind except Exception) is disabled repo-wide: every hit is a caller-supplied
# callable or a top-level entrypoint/reconnect boundary where no narrower exception type
# exists to catch, so the rule adds noise rather than catching real bugs here.
# I001 (import sorting) is disabled: isort --profile black already owns import order in
# CI, and it disagrees with ruff's isort implementation on a couple of groupings, so
# running both fights over the same job.
ignore = ["BLE001", "I001"]

[tool.mypy]
plugins = ["pydantic.mypy"]
python_version = "3.11"
exclude=["tests", ".reference"]
disallow_untyped_defs = true
disallow_subclassing_any = true
disallow_untyped_calls = false
check_untyped_defs = true
disallow_untyped_decorators = false
ignore_missing_imports = true
implicit_reexport = false
no_implicit_optional = true
strict_equality = true
warn_redundant_casts = true
warn_unused_ignores = true

[tool.bandit]
exclude_dirs = [".deprecated", ".reference"]

[tool.pytest.ini_options]
pythonpath = ["app", "extensions"]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.coverage.run]
source = ["app", "extensions"]
branch = true

[tool.coverage.report]
show_missing = true
skip_empty = true
