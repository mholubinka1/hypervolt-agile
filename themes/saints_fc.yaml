# Southampton FC home kit -- five wide vertical stripes across the charger face:
#   white . red . white . red . white   (left -> right)
#
# One colour per LED, by which vertical stripe the LED position falls in. LED
# positions are the golden record in themes/reference/charger_led_map.json;
# preview and edit with themes/reference/charger_led_map.html.
default_colour: "#FFFFFF"
segments:
  - colour: "#D71920"        # Southampton red
    ranges:
      - [1, 2]
      - [5, 6]
      - [21, 22]
      - [24, 25]
      - [39, 40]
      - [42, 44]
      - [48, 50]
